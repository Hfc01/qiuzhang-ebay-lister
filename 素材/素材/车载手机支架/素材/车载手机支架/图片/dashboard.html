<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数字酋长批量刊登 · 监控台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2d3436; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #636e72; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .phase { font-size: 16px; font-weight: bold; }
  .controls button { padding: 10px 22px; margin-right: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .btn-start { background: #0984e3; color: #fff; }
  .btn-confirm { background: #00b894; color: #fff; }
  .btn-stop { background: #d63031; color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .confirm-bar { background: #fff3cd; border: 1px solid #ffe08a; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .confirm-bar.show { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; }
  th { background: #f0f3f7; }
  .st-pending { color: #b2bec3; } .st-running { color: #0984e3; }
  .st-ok { color: #00b894; } .st-error { color: #d63031; }
  #log { background: #1e272e; color: #d2dae2; font-family: Consolas, monospace; font-size: 12px;
         padding: 12px; border-radius: 8px; height: 220px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>🛳 数字酋长 · eBay 批量复制刊登</h1>
<div class="sub">安全原则：工具不会点「开始刊登」，最后一步由你人工检查后自己提交</div>

<div class="confirm-bar" id="confirmBar">
  ⚠️ <b id="confirmText">等待确认</b> &nbsp;
  <button class="btn-confirm" onclick="confirmGo()">确认继续 →</button>
</div>

<div class="card">
  <div class="phase" id="phase">待机中</div>
  <div style="margin: 10px 0;" class="controls">
    <label style="font-size:13px;margin-right:6px;">产品素材：</label>
    <select id="matSelect" style="padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;margin-right:12px;min-width:220px;"></select>
    <button class="btn-start" id="btnStart" onclick="start()">▶ 开始执行</button>
    <button class="btn-stop" id="btnStop" onclick="stop()" disabled>■ 停止</button>
  </div>
  <div class="sub">使用前提：调试浏览器已打开数字酋长「在线Listing」页，且你已勾选要复制的 Listing（只勾 1 条）；
  每个产品一个文件夹（<b>素材/产品名/标题.txt + 图片/</b>），下拉框选用哪套素材</div>
</div>

<div class="card">
  <div style="font-weight:bold; margin-bottom:8px;">
    📋 在线 Listing 列表（自动读取）
    <button onclick="loadListings()" id="btnListings" style="margin-left:10px;padding:5px 14px;border:1px solid #ccc;border-radius:6px;background:#f8f9fa;cursor:pointer;font-size:12px;">↻ 刷新列表</button>
    <span id="listHint" style="font-weight:normal;font-size:12px;color:#636e72;margin-left:10px;">选中一条后点「开始执行」；也可以自己在页面勾选后不选这里直接开始</span>
  </div>
  <div style="max-height:200px;overflow-y:auto;">
    <table>
      <thead><tr><th></th><th>SKU</th><th>标题</th><th>eBay 账号</th><th>价格</th></tr></thead>
      <tbody id="listingRows"><tr><td colspan="5" style="color:#b2bec3;">点「刷新列表」读取</td></tr></tbody>
    </table>
  </div>
</div>

<div class="card">
  <table>
    <thead><tr><th>行</th><th>eBay 账号</th><th>标题</th><th>图片</th><th>状态</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="card">
  <div style="font-weight:bold; margin-bottom:8px;">运行日志</div>
  <div id="log"></div>
</div>

<script>
async function refresh() {
  const s = await (await fetch('/api/status')).json();
  document.getElementById('phase').textContent = s.phaseText || '待机中';
  document.getElementById('btnStart').disabled = s.running;
  document.getElementById('btnStop').disabled = !s.running;
  const cb = document.getElementById('confirmBar');
  cb.classList.toggle('show', s.waitConfirm);
  document.getElementById('confirmText').textContent = s.phaseText.replace('⏸ 等待确认: ', '');
  const tb = document.getElementById('rows');
  if (s.rows.length) {
    tb.innerHTML = s.rows.map(r => `<tr>
      <td>${r.row}</td><td>${r.account || '-'}</td>
      <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.title || '-'}</td>
      <td>${r.image || '-'}</td>
      <td class="st-${r.status}">${{pending:'待处理',running:'执行中',ok:'✅ 完成',error:'❌ 失败'}[r.status] || r.status}</td>
    </tr>`).join('');
  }
  const lg = document.getElementById('log');
  const logs = s.logs.join('\n');
  if (lg.textContent !== logs) { lg.textContent = logs; lg.scrollTop = lg.scrollHeight; }
  // 素材下拉框
  const sel = document.getElementById('matSelect');
  const mats = s.materials || [];
  const cur = sel.value;
  const optStr = mats.map(m => `<option value="${m.folder}">${m.folder}（标题${m.titles}·图${m.images}）</option>`).join('');
  const empty = '<option value="">（素材/ 下还没有产品文件夹）</option>';
  if (sel.dataset.sig !== optStr) {
    sel.dataset.sig = optStr;
    sel.innerHTML = mats.length ? optStr : empty;
    if (mats.length && mats.some(m => m.folder === cur)) sel.value = cur;
  }
}
async function start() {
  const folder = document.getElementById('matSelect').value;
  const target = document.querySelector('input[name="pickListing"]:checked')?.value || '';
  await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder, target }) });
  refresh();
}
async function loadListings() {
  const btn = document.getElementById('btnListings');
  btn.disabled = true; btn.textContent = '读取中…';
  const r = await (await fetch('/api/listings')).json();
  btn.disabled = false; btn.textContent = '↻ 刷新列表';
  const tb = document.getElementById('listingRows');
  const hint = document.getElementById('listHint');
  if (!r.ok) { tb.innerHTML = `<tr><td colspan="5" style="color:#d63031;">${r.error}</td></tr>`; return; }
  hint.textContent = `共 ${r.rows.length} 条，选中一条后点「开始执行」`;
  tb.innerHTML = r.rows.map(row => `<tr>
    <td><input type="radio" name="pickListing" value="${row.id}"></td>
    <td>${row.sku}</td>
    <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${row.title}">${row.title}</td>
    <td>${row.account}</td>
    <td>${row.price}</td>
  </tr>`).join('');
}
async function stop() { await fetch('/api/stop', {method:'POST'}); }
async function confirmGo() { await fetch('/api/confirm', {method:'POST'}); refresh(); }
setInterval(refresh, 800);
refresh();
</script>
</body>
</html>
